<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hop Hop Kingdom</title>
<link rel="stylesheet" href="/src/style.css">
<!-- SDK do CrazyGames: se não carregar (offline, outro site), o jogo funciona igual, sem anúncios -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body class="loading">
<script>
// avisa o portal que o jogo começou a carregar logo de cara, antes do código do jogo (1,5 MB) terminar de baixar
// (aqui no começo do body: o init do SDK mexe no document.body)
window.__cgBoot = window.CrazyGames && window.CrazyGames.SDK ? window.CrazyGames.SDK.init().then(function () {
  var s = window.CrazyGames.SDK;
  if (s.environment === 'crazygames' || s.environment === 'local') { try { s.game.loadingStart(); window.__cgLoadingStarted = true; } catch (e) {} }
}) : null;
</script>
<div id="loading"><img id="loadLogo" src="assets/logo.png" alt="Hop Hop Kingdom"><div id="loadTrack"><i id="loadBar"></i></div></div>
<div id="game"></div>
<div id="stats">
  <div id="coins"><i class="coin"></i><span id="coinN">0</span><small id="incomeN"></small></div>
  <div id="wave"><i class="flag">⚔️</i><span id="waveN">0</span><small data-i18n="ui.wave_label">wave</small><small id="nextN" class="next"></small><button id="callWave" hidden data-i18n-title="ui.call_wave"></button></div>
  <div id="goal"></div>
  <div id="mana" hidden><i class="gem"></i><span id="manaN">0</span><small id="manaInc"></small></div>
</div>
<button id="upgrade" class="slot green" hidden></button><button id="moveBtn" class="slot green ringbtn mv" hidden></button><button id="sellBtn" class="slot green ringbtn sl" hidden></button><button id="infoBtn" class="slot green ringbtn info" hidden></button><button id="evoA" class="slot green ringbtn evo" hidden></button><button id="evoB" class="slot green ringbtn evo" hidden></button><button id="evoC" class="slot green ringbtn evo" hidden></button><button id="evoD" class="slot green ringbtn evo" hidden></button>
<div id="audio"><button id="gift" class="ic" data-i18n-title="ui.gift_title" title="Watch an ad for free coins"></button><button id="forgeBtn" class="ic" data-i18n-title="ui.forge" title="Royal Forge"><b id="forgeBadge">0</b></button><button id="menuBtn" class="ic" data-i18n-title="ui.menu" title="Menu" aria-expanded="false"><b id="menuDots">•••</b></button><div id="menuList" hidden><button id="pauseBtn" class="ic" data-i18n-title="ui.pause" title="Pause"></button><button id="langBtn" class="ic" data-i18n-title="ui.language" title="Language"></button><button id="musicBtn" class="ic" data-i18n-title="ui.music" title="Music"></button><button id="sfxBtn" class="ic" data-i18n-title="ui.sfx" title="Sound effects"></button></div></div>
<div id="langMenu" hidden></div>
<div id="bar"></div>
<div id="hint"></div>
<div id="banner" hidden><b id="bannerT"></b><span id="bannerS"></span></div>
<div id="tuto" hidden><span id="tutoTxt"></span><button id="tutoSkip" data-i18n="tuto.skip">Skip tutorial</button></div>
<div id="pause" hidden><div id="pausebox"><h1 data-i18n="ui.paused">PAUSED</h1><button id="resume" data-i18n="ui.resume">Resume</button></div></div>
<div id="forge" hidden><div id="forgebox"><h1 data-i18n="ui.forge">Royal Forge</h1><p class="fsub" data-i18n="ui.forge_sub">Spend Royal Stars on upgrades that last forever, even in a brand-new city.</p><div id="forgeTop"><span>⭐ <b id="forgeStars">0</b></span><small data-i18n="ui.forge_earn">Earn stars: 1 per 10 orcs, new best waves, Orc King kills</small></div><div id="forgeList"></div><div id="forgeNav"><button id="fPrev" aria-label="prev">◀</button><span id="fPage"></span><button id="fNext" aria-label="next">▶</button></div><button id="forgeClose" data-i18n="ui.close">Close</button></div></div>
<div id="over" hidden><div id="overbox" class="slot-like"><h1 data-i18n="ui.over_title">The city has fallen!</h1><p id="overTxt" data-i18n="ui.over_default">The orcs destroyed the Town Center.</p><p id="overStats"></p><p id="overStars"></p><button id="rebuild" data-i18n="ui.rebuild">Rebuild the city</button><button id="overForge" class="alt" data-i18n="ui.forge_open">Royal Forge</button><button id="rebuildFree" class="alt" data-i18n="ui.rebuild_free">Rebuild for free (watch an ad)</button><button id="again" class="link" data-i18n="ui.restart">Start over</button></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
